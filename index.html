<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ピクオーバーポップコーンアトラクター</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #000000; font-family: monospace; }
  canvas { display:block; margin:0 auto; }
  input[type=range] { accent-color: #ff8800; width:100%; }
  .ctrl { background:#0a0500; border:1px solid #442200; border-radius:6px; padding:8px; }
  label { font-size:11px; color:#aa6633; display:block; }
  select { background:#0a0500; border:1px solid #442200; color:#ffaa66; padding:2px 4px; border-radius:4px; width:100%; }
</style>
</head>
<body class="min-h-screen text-orange-100 p-4">
<div class="max-w-4xl mx-auto">
  <div class="text-center mb-4">
    <h1 class="text-2xl font-bold text-orange-300">🍿 ポップコーンアトラクター</h1>
    <p class="text-orange-700 text-xs">ピクオーバー軌道密度マップ — カオス的な軌道の累積が作るパターン</p>
  </div>
  <div class="flex flex-wrap gap-4 justify-center">
    <canvas id="cv" width="460" height="460"></canvas>
    <div class="flex flex-col gap-2 w-56">
      <div class="ctrl">
        <label>h パラメータ: <span id="v_h">0.05</span></label>
        <input type="range" id="sl_h" min="0.01" max="0.1" step="0.005" value="0.05">
      </div>
      <div class="ctrl">
        <label>反復数/軌道: <span id="v_iter">500</span></label>
        <input type="range" id="sl_iter" min="100" max="2000" step="100" value="500">
      </div>
      <div class="ctrl">
        <label>軌道数 (x1000): <span id="v_orbs">50</span>k</label>
        <input type="range" id="sl_orbs" min="10" max="200" step="10" value="50">
      </div>
      <div class="ctrl">
        <label>カラーマップ</label>
        <select id="colormap">
          <option value="heat">ヒート</option>
          <option value="cool">クール</option>
          <option value="neon">ネオン</option>
          <option value="fire">炎</option>
          <option value="mono">モノクロ</option>
        </select>
      </div>
      <button onclick="startRender()" id="startBtn" class="bg-orange-900 hover:bg-orange-800 rounded text-xs py-2 border border-orange-700">▶ 描画開始</button>
      <button onclick="stopRender()" class="bg-red-950 hover:bg-red-900 rounded text-xs py-2 border border-red-800">⏸ 停止</button>
      <button onclick="downloadPNG()" class="bg-amber-900 hover:bg-amber-800 rounded text-xs py-2 border border-amber-700">💾 PNG保存</button>
      <div class="text-xs text-orange-800 mt-1" id="progress"></div>
    </div>
  </div>
  <div class="mt-3 bg-orange-950 rounded p-3 border border-orange-900 text-xs text-orange-700">
    <strong class="text-orange-400">ポップコーンマップ：</strong>
    x_{n+1} = x_n - h·sin(y_n + tan(3·y_n)), y_{n+1} = y_n - h·sin(x_n + tan(3·x_n))<br>
    多数のランダム開始点から軌道を計算し、訪問したピクセルの累積密度をBuddhabrotスタイルで可視化する。
  </div>
</div>
<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;

let running=false,animId=null;
let density=null;

const colormaps={
  heat:(t)=>{
    const r=Math.round(255*Math.min(1,t*1.5));
    const g=Math.round(255*Math.max(0,t*2-0.5));
    const b=Math.round(255*Math.max(0,t*3-2));
    return[r,g,b];
  },
  cool:(t)=>[Math.round(t*100),Math.round(t*200),Math.round(t*255)],
  neon:(t)=>{
    const v=t*Math.PI*2;
    return[Math.round(128+127*Math.sin(v)),Math.round(128+127*Math.sin(v+2)),Math.round(128+127*Math.cos(v))];
  },
  fire:(t)=>{
    const r=Math.round(255*Math.min(1,t*3));
    const g=Math.round(255*Math.max(0,t*3-1));
    const b=Math.round(255*Math.max(0,t*3-2));
    return[r,g,b];
  },
  mono:(t)=>{const v=Math.round(t*255);return[v,v,v];}
};

function coordToPixel(x,y){
  // Map [-3,3] to [0,W]
  const px=Math.floor((x+3)/6*W);
  const py=Math.floor((y+3)/6*H);
  return[px,py];
}

function renderDensity(){
  if(!density) return;
  const imgd=ctx.createImageData(W,H);
  const data=imgd.data;
  // Find max
  let maxD=0;
  for(let i=0;i<density.length;i++) if(density[i]>maxD) maxD=density[i];
  if(maxD===0) return;
  const cmap=colormaps[document.getElementById('colormap').value]||colormaps.heat;
  for(let i=0;i<density.length;i++){
    if(density[i]===0) continue;
    const t=Math.sqrt(density[i]/maxD); // sqrt for better contrast
    const [r,g,b]=cmap(t);
    const pi=i*4;
    data[pi]=r;data[pi+1]=g;data[pi+2]=b;data[pi+3]=255;
  }
  ctx.clearRect(0,0,W,H);
  ctx.putImageData(imgd,0,0);
}

let batchIdx=0,totalBatches=0;

function startRender(){
  stopRender();
  density=new Uint32Array(W*H);
  batchIdx=0;
  const totalOrbs=parseInt(document.getElementById('sl_orbs').value)*1000;
  const batchSize=2000;
  totalBatches=Math.ceil(totalOrbs/batchSize);
  running=true;
  document.getElementById('startBtn').textContent='⏳ 描画中...';
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  doBatch(batchSize,totalOrbs);
}

function doBatch(batchSize,totalOrbs){
  if(!running) return;
  const h=parseFloat(document.getElementById('sl_h').value);
  const maxIter=parseInt(document.getElementById('sl_iter').value);
  const done=Math.min(batchIdx*batchSize,totalOrbs);
  const count=Math.min(batchSize,totalOrbs-done);
  if(count<=0){finishRender();return;}

  for(let o=0;o<count;o++){
    let x=(Math.random()-0.5)*6;
    let y=(Math.random()-0.5)*6;
    for(let i=0;i<maxIter;i++){
      const nx=x-h*Math.sin(y+Math.tan(3*y));
      const ny=y-h*Math.sin(x+Math.tan(3*x));
      x=nx;y=ny;
      if(!isFinite(x)||!isFinite(y)||Math.abs(x)>10||Math.abs(y)>10) break;
      const [px,py]=coordToPixel(x,y);
      if(px>=0&&px<W&&py>=0&&py<H) density[py*W+px]++;
    }
  }

  batchIdx++;
  const pct=Math.round(batchIdx/totalBatches*100);
  document.getElementById('progress').textContent=`${pct}% (${(done+count).toLocaleString()}軌道)`;

  if(pct%10===0||batchIdx===totalBatches){
    renderDensity();
  }

  if(batchIdx<totalBatches){
    animId=requestAnimationFrame(()=>doBatch(batchSize,totalOrbs));
  } else {
    finishRender();
  }
}

function finishRender(){
  running=false;
  document.getElementById('startBtn').textContent='▶ 描画開始';
  renderDensity();
  document.getElementById('progress').textContent='完了！';
}

function stopRender(){
  running=false;
  if(animId) cancelAnimationFrame(animId);
  animId=null;
  document.getElementById('startBtn').textContent='▶ 描画開始';
}

function downloadPNG(){
  const a=document.createElement('a');a.download='popcorn-attractor.png';a.href=cv.toDataURL();a.click();
}

['sl_h','sl_iter','sl_orbs'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{
    document.getElementById('v_'+id.replace('sl_','')).textContent=
      parseFloat(document.getElementById(id).value).toFixed(id==='sl_h'?3:0);
  });
});
document.getElementById('colormap').addEventListener('change',renderDensity);

// Initial draw
ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ff8800';
ctx.font='16px monospace';
ctx.textAlign='center';
ctx.fillText('「描画開始」ボタンを押してください',W/2,H/2);
</script>
</body>
</html>
